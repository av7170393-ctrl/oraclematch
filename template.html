<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OracleMatch: find your next favourite movie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a0a0f;--panel:#14141c;--panel2:#1b1b26;--ink:#f5f5f7;--mute:#9b9bad;--red:#e5383b;--gold:#ffcc4d;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.1);--hero:linear-gradient(#150a0c,var(--bg));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f6f9;--panel:#fff;--panel2:#fff;--ink:#14141b;--mute:#5b5b6e;--line:rgba(0,0,0,.14);--chip:rgba(0,0,0,.08);--hero:linear-gradient(#ffe6e7,var(--bg))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.hero{position:relative;padding:62px 18px 26px;text-align:center;background:radial-gradient(90% 120% at 50% -20%,rgba(229,56,59,.55),transparent 60%),var(--hero)}
.brand{font:400 1.5rem/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.14em;margin-bottom:1.6rem}
.brand b{color:var(--red);font-weight:400}
h1{font:400 clamp(2.5rem,9vw,4.6rem)/.95 "Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;margin:0 auto;max-width:12ch}
.sub{color:var(--mute);margin:.9rem auto 1.4rem;max-width:36ch}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{background:transparent;border:0;border-radius:999px;padding:.5rem 1.2rem;color:var(--mute);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.box{position:relative;max-width:560px;margin:0 auto;text-align:left}
input{width:100%;font:500 1.02rem "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.95rem 1.1rem}
input::placeholder{color:var(--mute)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;margin:0;padding:6px;list-style:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.sug li{padding:.55rem .75rem;border-radius:8px;cursor:pointer}
.sug li:hover,.sug li[aria-selected="true"]{background:rgba(229,56,59,.25)}
.sug small{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:.4rem;align-items:center;background:rgba(229,56,59,.16);border:1px solid rgba(229,56,59,.6);border-radius:999px;padding:.15rem .35rem .15rem .8rem;font-size:.9rem}
.chip button{all:unset;cursor:pointer;width:1.4rem;height:1.4rem;text-align:center;border-radius:50%}
.chip button:hover{background:var(--chip)}
.note{color:var(--mute);text-align:center;margin:.8rem 0 0;min-height:1.4em;font-size:.92rem}
main{padding-bottom:50px}
section{margin-top:26px}
h2{font:400 1.7rem/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.05em;margin:0 18px 10px}
#res:has(#rh[hidden]){display:none}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:18px;padding:6px 18px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.pc{all:unset;box-sizing:border-box;flex:0 0 136px;scroll-snap-align:start;cursor:pointer;position:relative;display:block}
.pc:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.pimg{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#1d1d27;transition:transform .2s ease,box-shadow .2s ease}
.pc:hover .pimg{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.65)}
.rt{position:absolute;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.72);color:var(--gold);font-size:.75rem;font-weight:700;border-radius:6px;padding:.05rem .4rem}
.pt{display:block;font-size:.84rem;font-weight:500;margin-top:.45rem;line-height:1.25;color:var(--ink)}
.ranked .pc{flex-basis:178px;padding-left:46px}
.rk{position:absolute;left:0;bottom:30px;font:400 6.4rem/.8 "Bebas Neue",Impact,sans-serif;color:var(--bg);-webkit-text-stroke:3px #8d8d9c;letter-spacing:-.04em}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;gap:16px}
.top .pimg{flex:0 0 118px;height:177px;aspect-ratio:auto}
.top h3{font:400 2rem/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.03em;margin:0 0 .4rem}
.meta{color:var(--gold);font-weight:700;margin:0 0 .6rem}
.gen{display:flex;flex-wrap:wrap;gap:6px}
.gen span{border:1px solid var(--line);border-radius:999px;padding:.1rem .65rem;font-size:.8rem;color:var(--mute)}
#so{margin:1rem 0;color:var(--ink);opacity:.88}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:.7rem 1.2rem;font-weight:700;cursor:pointer;background:var(--chip);color:var(--ink);text-decoration:none;display:inline-block}
.btn.red{background:var(--red);color:#fff}
@media (min-width:720px){#sheet{align-items:center}.panel{border-radius:20px}}
footer{margin-top:40px;padding:0 18px;text-align:center}
.kb{font:500 .85rem "DM Sans",system-ui,sans-serif;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.45rem .95rem;cursor:pointer}
.ic{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.moods{margin-top:12px}.moods button{cursor:pointer;font:500 .85rem "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:.35rem .85rem}
.fbox[hidden]{display:none}
.fbox{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.fbox select{font:500 .85rem "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;max-width:46%}
.rhd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:18px}
.rhd h2{margin-bottom:10px}
.why{display:block;font-size:.74rem;color:var(--mute);margin-top:.15rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hint{color:var(--mute);font-size:.9rem;margin:.6rem 0}
.hint b{color:var(--ink)}
.det p{margin:.35rem 0;font-size:.92rem}.det b{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-weight:700;z-index:80}
#toast[hidden]{display:none}
.rep table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0}
.rep th,.rep td{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:left}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--red)}
.rep summary{list-style:none;display:inline-block}
.pc[hidden]{display:none}
.pc.seen .pimg::after{content:"Seen";position:absolute;left:6px;top:6px;z-index:2;background:rgba(0,0,0,.75);color:#8fe3a0;font-size:.7rem;font-weight:700;padding:.05rem .4rem;border-radius:6px}
.pc.seen .pimg svg,.pc.seen .pimg img{opacity:.55}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.pimg{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <button id="th" type="button" class="kb ic" aria-label="Switch light or dark theme"></button>
  <div class="brand">ORACLE<b>MATCH</b></div>
  <h1>Find your next favourite movie</h1>
  <p class="sub">Pick a film you love and get ten more like it, from <span id="cnt"></span> titles.</p>
  <div class="seg" role="group" aria-label="Mode"><button id="t1" aria-pressed="true">One film</button><button id="t2" aria-pressed="false">My taste</button></div>
  <div class="box">
    <input id="q" type="text" placeholder="Search films…" autocomplete="off" aria-label="Search for a film" role="combobox" aria-expanded="false" aria-controls="sug">
    <ul class="sug" id="sug" role="listbox" hidden></ul>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools"><button id="sur" type="button" class="kb">Surprise me</button><button id="ftog" type="button" class="kb" aria-expanded="false">Filters</button></div>
  <div class="moods" id="moods"></div>
  <div class="fbox" id="fbox" hidden></div>
  <p class="note" id="note" aria-live="polite"></p>
</header>
<main>
  <section id="res"><div class="rhd"><h2 id="rh" hidden></h2><button id="shr" type="button" class="kb">Share list</button></div><div class="row ranked" id="grid"></div></section>
  <section id="wlsec" hidden><div class="rhd"><h2>My watchlist</h2><button id="wlrec" type="button" class="kb">More like my watchlist</button></div><div class="row" id="wl"></div></section>
  <section><h2>Trending now</h2><div class="row" id="r1"></div></section>
  <section><h2>Highly rated</h2><div class="row" id="r2"></div></section>
  <section id="r3sec"><h2>Bollywood and Indian hits</h2><div class="row" id="r3"></div></section>
  <section id="r4sec"><h2>Horror nights</h2><div class="row" id="r4"></div></section>
  <footer>
    <div style="margin-bottom:14px"><span class="note" id="hmsg"></span> <button id="hrst" type="button" class="kb">Reset seen and hidden</button></div>
    <details class="rep" id="rep"><summary class="kb">Model report</summary><div id="repb" style="text-align:left;max-width:640px;margin:10px auto 22px"></div></details>
    <div><button id="kb" type="button" class="kb"></button>
    <div id="kbox" hidden style="max-width:560px;margin:14px auto 0">
      <div id="kset">
        <input id="kin" type="text" placeholder="Paste your TMDB API Key here" aria-label="TMDB API key" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p style="margin:10px 0 0"><button id="ksave" type="button" class="kb">Save key</button></p>
      </div>
      <div id="kon" hidden>
        <p class="note" id="kmask" style="margin:0 0 10px"></p>
        <button id="krem" type="button" class="kb">Remove key</button>
      </div>
      <p style="margin:10px 0 0"><button id="ktest" type="button" class="kb">Test connection</button></p>
      <p class="note" id="kmsg" aria-live="polite"></p>
    </div></div>
  </footer>
</main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="panel">
    <div class="top"><div class="pimg" id="sp"></div><div><h3 id="st"></h3><p class="meta" id="sm"></p><div class="gen" id="sg"></div></div></div>
    <p id="so"></p>
    <div id="swhy"></div><div id="sdet" class="det"></div>
    <div class="btns"><button class="btn red" id="smore" type="button"></button><button class="btn" id="swl" type="button"></button><button class="btn" id="sseen" type="button"></button><button class="btn" id="shide" type="button"></button><button class="btn" id="sx" type="button">Close</button></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<script>

/* TMDB key: use the "Set TMDB poster key" button at the bottom of the page, or paste it below. Without a key, posters come from Wikipedia. */
let LK="";try{LK=localStorage.getItem("tk")||""}catch(e){}
const TMDB_KEY=LK||"PASTE_YOUR_TMDB_API_KEY_HERE";
const D=__DATA__;
const M=D.m,NB=D.nb,SC=D.sc;
const $=id=>document.getElementById(id);
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
let mode=1,liked=[],pulse=0;

/* ---------- helpers ---------- */
const HUE={Fantasy:270,'Science Fiction':190,Action:8,Adventure:38,Animation:320,Comedy:48,Crime:0,Drama:228,Horror:350,Romance:332,Thriller:208,Family:96,Mystery:250,War:18,Western:30,History:34,Music:300,Documentary:150};
const GLY={Fantasy:'✦','Science Fiction':'☄',Action:'⚔',Adventure:'⚑',Animation:'❀',Comedy:'☺',Crime:'☠',Drama:'❖',Horror:'☾',Romance:'♥',Thriller:'⌖',Family:'☀',Mystery:'⚝',War:'⚔',Western:'✧',History:'♜',Music:'♪',Documentary:'◉'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase();
/* ---------- procedural poster art (SVG, one unique poster per film) ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mk(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SCN={'Science Fiction':'space',Fantasy:'castle',Action:'city',Thriller:'noir',Crime:'noir',War:'city',Horror:'woods',Romance:'sunset',Animation:'cloud',Family:'cloud',Comedy:'cloud',Adventure:'peaks',Western:'mesa',History:'peaks',Mystery:'woods',Drama:'lone',Music:'waves',Documentary:'globe'};
const PRI=['Science Fiction','Fantasy','Horror','Western','Animation','Romance','War','History','Music','Documentary','Mystery','Crime','Thriller','Adventure','Action','Family','Comedy','Drama'];
function art(i){
  const m=M[i],g=PRI.find(x=>m[2].includes(x))||m[2][0]||'',h=((HUE[g]??262)+(hash(m[0])%50)-25+360)%360,r=mk(hash(m[0]+m[1])),k=SCN[g]||'lone';
  const c1=`hsl(${h} 62% 13%)`,c2=`hsl(${(h+30)%360} 74% 42%)`,ac=`hsl(${(h+170)%360} 92% 74%)`,dk=`hsl(${h} 55% 7%)`,md=`hsl(${h} 48% 17%)`;
  let s='';
  for(let n=0;n<40;n++)s+=`<circle cx="${r()*200|0}" cy="${r()*150|0}" r="${(r()*1.1+.3).toFixed(1)}" fill="#fff" opacity="${(r()*.7+.2).toFixed(2)}"/>`;
  const ridge=(y,amp,col)=>{let d=`M0 300 L0 ${y}`;for(let x=0;x<=200;x+=20)d+=` L${x} ${(y-r()*amp).toFixed(0)}`;return `<path d="${d} L200 300Z" fill="${col}"/>`};
  const orb=(cx,cy,rr)=>`<circle cx="${cx}" cy="${cy}" r="${rr*1.8}" fill="${ac}" opacity=".16"/><circle cx="${cx}" cy="${cy}" r="${rr}" fill="${ac}" opacity=".95"/>`;
  const wins=(x,y,w,hh)=>{let o='';for(let a=y+6;a<y+hh-4;a+=9)for(let b=x+3;b<x+w-3;b+=6)if(r()<.28)o+=`<rect x="${b}" y="${a}" width="2.5" height="3.5" fill="${ac}" opacity=".85"/>`;return o};
  if(k==='space'){
    s+=orb(150,45,9)+`<circle cx="100" cy="112" r="46" fill="hsl(${(h+20)%360} 55% 30%)"/><circle cx="88" cy="98" r="40" fill="hsl(${(h+20)%360} 60% 38%)" opacity=".6"/><ellipse cx="100" cy="112" rx="78" ry="14" fill="none" stroke="${ac}" stroke-width="2.5" transform="rotate(-18 100 112)" opacity=".9"/>`+ridge(220,18,dk);
  }else if(k==='castle'){
    s+=orb(r()*80+60,62,24)+ridge(205,26,md);
    s+=`<g fill="${dk}"><rect x="72" y="150" width="56" height="62"/><rect x="62" y="132" width="16" height="80"/><rect x="122" y="132" width="16" height="80"/><rect x="93" y="118" width="14" height="94"/><path d="M60 132 L70 112 L80 132Z"/><path d="M120 132 L130 112 L140 132Z"/><path d="M91 118 L100 90 L109 118Z"/></g><g fill="${ac}"><rect x="97" y="140" width="6" height="9"/><rect x="66" y="150" width="5" height="8"/><rect x="129" y="150" width="5" height="8"/></g>`+ridge(228,14,dk);
  }else if(k==='city'||k==='noir'){
    s+=orb(100,105,32);
    if(k==='city')for(let n=0;n<8;n++)s+=`<path d="M100 105 L${n*28-10} 0 L${n*28+8} 0Z" fill="${ac}" opacity=".08"/>`;
    for(let x=-4;x<200;){const w=14+r()*16,hh=40+r()*80;s+=`<rect x="${x.toFixed(0)}" y="${(210-hh).toFixed(0)}" width="${w.toFixed(0)}" height="${hh.toFixed(0)}" fill="${dk}"/>`+wins(x,210-hh,w,hh);x+=w+1}
    if(k==='noir')for(let n=0;n<26;n++){const x=r()*200,y=r()*190;s+=`<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-4).toFixed(0)}" y2="${(y+16).toFixed(0)}" stroke="${ac}" opacity=".25"/>`}
  }else if(k==='woods'){
    s+=orb(r()*60+110,60,20)+ridge(205,20,md);
    for(let n=0;n<11;n++){const x=r()*200,t=205-(50+r()*50);s+=`<path d="M${(x-11).toFixed(0)} 215 L${x.toFixed(0)} ${t.toFixed(0)} L${(x+11).toFixed(0)} 215Z" fill="${dk}"/>`}
    s+=`<ellipse cx="60" cy="205" rx="80" ry="10" fill="#fff" opacity=".1"/><ellipse cx="150" cy="195" rx="70" ry="8" fill="#fff" opacity=".08"/>`;
  }else if(k==='sunset'){
    s+=orb(100,125,40)+ridge(190,26,md)+ridge(222,18,dk)+`<path transform="translate(100 64) scale(1.7)" d="M0 8 C-18 -6 -10 -20 0 -10 C10 -20 18 -6 0 8Z" fill="#fff" opacity=".92"/>`;
  }else if(k==='cloud'){
    s+=orb(150,52,22);
    for(let n=0;n<5;n++){const x=r()*190,y=60+r()*70;s+=`<g fill="#fff" opacity=".85"><ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="26" ry="9"/><ellipse cx="${(x+12).toFixed(0)}" cy="${(y-6).toFixed(0)}" rx="14" ry="8"/></g>`}
    s+=ridge(195,22,md)+ridge(222,16,dk);
  }else if(k==='peaks'){
    s+=orb(r()*90+55,70,22)+ridge(170,70,md)+ridge(208,50,dk);
  }else if(k==='mesa'){
    s+=orb(100,100,36);
    for(let n=0;n<2;n++){const x=n?118:22+r()*20;s+=`<path d="M${x.toFixed(0)} 215 L${(x+5).toFixed(0)} 158 L${(x+52).toFixed(0)} 158 L${(x+58).toFixed(0)} 215Z" fill="${dk}"/>`}
    s+=`<rect y="208" width="200" height="92" fill="${md}"/>`;
  }else if(k==='waves'){
    s+=orb(100,80,28);
    for(let n=0;n<7;n++){const y=118+n*13;s+=`<path d="M0 ${y} Q25 ${y-16} 50 ${y} T100 ${y} T150 ${y} T200 ${y}" fill="none" stroke="${ac}" stroke-width="1.6" opacity="${(.8-n*.09).toFixed(2)}"/>`}
  }else if(k==='globe'){
    s+=`<circle cx="100" cy="108" r="46" fill="${md}" stroke="${ac}" stroke-width="1.6"/><ellipse cx="100" cy="108" rx="22" ry="46" fill="none" stroke="${ac}" opacity=".6"/><ellipse cx="100" cy="108" rx="40" ry="46" fill="none" stroke="${ac}" opacity=".4"/><line x1="54" y1="108" x2="146" y2="108" stroke="${ac}" opacity=".6"/><ellipse cx="100" cy="86" rx="40" ry="3" fill="none" stroke="${ac}" opacity=".4"/><ellipse cx="100" cy="130" rx="40" ry="3" fill="none" stroke="${ac}" opacity=".4"/>`+ridge(224,10,dk);
  }else{
    s+=orb(100,96,40)+ridge(212,16,dk)+`<circle cx="100" cy="166" r="5.5" fill="${dk}"/><path d="M93 214 L95 173 L105 173 L107 214Z" fill="${dk}"/>`;
  }
  const words=m[0].split(' ');let L=[],cur='';
  words.forEach(w=>{if(cur&&(cur+' '+w).length>11){L.push(cur);cur=w}else cur=cur?cur+' '+w:w});L.push(cur);
  if(L.length>3){L=L.slice(0,3);L[2]=L[2].slice(0,10)+'…'}
  const mx=Math.max(...L.map(x=>x.length)),fs=mx<=7?26:mx<=9?22:mx<=11?19:mx<=13?16:mx<=16?13:11,y0=250-(L.length-1)*fs*.58;
  const tx=L.map((x,j)=>`<text x="100" y="${(y0+j*fs*1.18).toFixed(0)}" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-weight="800" font-size="${fs}" fill="#fff" stroke="${dk}" stroke-width=".6" paint-order="stroke">${esc(x)}</text>`).join('');

/* ---------- TMDB details: trailer, cast, where to watch ---------- */
const DET={};
async function details(id){
  if(id in DET)return DET[id];
  try{
    let tid=id;
    if(typeof id==='string'){
      const f=await fetch(`https://api.themoviedb.org/3/find/${id}?api_key=${TMDB_KEY}&external_source=imdb_id`);
      if(!f.ok)return null;const fm=((await f.json()).movie_results||[])[0];if(!fm){DET[id]=null;return null}tid=fm.id;
    }
    const r=await fetch(`https://api.themoviedb.org/3/movie/${tid}?api_key=${TMDB_KEY}&append_to_response=videos,credits,watch/providers`);
    if(!r.ok)return null;DET[id]=await r.json();return DET[id]}catch(e){return null}
}
function renderDet(d){
  if(!d)return '<p class="hint">Details are not available right now.</p>';
  const dir=((d.credits&&d.credits.crew)||[]).find(c=>c.job==='Director'),cast=((d.credits&&d.credits.cast)||[]).slice(0,5).map(c=>c.name);
  const vs=((d.videos&&d.videos.results)||[]).filter(v=>v.site==='YouTube'),tr=vs.find(v=>v.type==='Trailer')||vs[0];
  const wp=d['watch/providers']&&d['watch/providers'].results&&d['watch/providers'].results.IN;
  const list=wp&&(wp.flatrate||wp.rent||wp.buy),kind=wp?(wp.flatrate?'Streaming':wp.rent?'Rent':'Buy'):'';
  let h='';
  if(d.runtime)h+=`<p><b>Runtime</b> ${d.runtime} min</p>`;
  if(dir)h+=`<p><b>Director</b> ${esc(dir.name)}</p>`;
  if(cast.length)h+=`<p><b>Cast</b> ${cast.map(esc).join(', ')}</p>`;
  h+=`<p><b>Where to watch (India)</b> ${list?kind+': '+list.map(x=>esc(x.provider_name)).join(', ')+' <small>(data by JustWatch)</small>':'not listed in India'}</p>`;
  if(tr)h+=`<p><a class="btn red" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=${encodeURIComponent(tr.key)}">Watch trailer</a></p>`;
  return h;
}
/* ---------- search by description (keyword-based, not semantic) ---------- */
const STOP=new Set('a an the and or of with in on for to movie movies film films like about that has have is are by from who which where some any very more most'.split(' '));
const ALIAS=[['sci-fi','science fiction'],['sci fi','science fiction'],['scifi','science fiction'],['rom-com','romance comedy'],['romcom','romance comedy'],['funny','comedy'],['scary','horror'],['animated','animation'],['cartoon','animation'],['kids','family'],['cops','crime'],['police','crime'],['detective','mystery'],['love','romance']];
const GENRES=[...new Set(M.flatMap(m=>m[2]))].map(g=>g.toLowerCase());
const SB=M.map(m=>({t:m[0].toLowerCase(),tw:new Set(m[0].toLowerCase().split(/[^a-z0-9]+/)),k:m[8].join(' | '),p:(m[6]+' '+m[7].join(' ')).toLowerCase(),pw:new Set((m[6]+' '+m[7].join(' ')).toLowerCase().split(/\s+/)),o:(m[4]||'').toLowerCase(),g:m[2].map(x=>x.toLowerCase())}));
function runNL(q){
  let s=' '+q.toLowerCase().replace(/[^a-z0-9\s-]/g,' ')+' ';
  ALIAS.forEach(a=>{s=s.split(a[0]).join(a[1])});
  const w=s.split(/\s+/).filter(t=>t.length>2&&!STOP.has(t)),skip=new Set([...GENRES.flatMap(g=>g.split(' ')),...Object.values(LANG).map(x=>x.toLowerCase()),'bollywood','kollywood','tollywood','mollywood']),toks=[...new Set(w)].filter(x=>!skip.has(x)),bis=[];
  for(let i=0;i<w.length-1;i++)bis.push(w[i]+' '+w[i+1]);
  const qg=GENRES.filter(g=>new RegExp('\\b'+g+'\\b').test(s)),dark=/\b(dark|gritty|noir)\b/.test(s),sc=[];
  const ql=Object.keys(LANG).filter(k=>new RegExp('\\b'+LANG[k].toLowerCase()+'\\b').test(s));
  [['bollywood','hi'],['kollywood','ta'],['tollywood','te'],['mollywood','ml']].forEach(x=>{if(s.includes(x[0]))ql.push(x[1])});
  for(let i=0;i<M.length;i++){const b=SB[i];let v=0;
    qg.forEach(g=>{if(b.g.includes(g))v+=3});
    bis.forEach(x=>{if(b.k.includes(x)||b.o.includes(x))v+=4;if(b.p.includes(x))v+=6});
    toks.forEach(t=>{if(b.tw.has(t))v+=2;if(b.k.includes(t))v+=3;if(b.pw.has(t))v+=4;if(b.o.includes(t))v+=1});
    if(ql.includes(M[i][9]))v+=8;
    if(dark&&b.g.some(g=>['crime','thriller','horror','mystery'].includes(g)))v+=2;
    if(v>0)sc.push([i,v*(.85+M[i][3]/60)])}
  sc.sort((a,b)=>b[1]-a[1]);SRC=[];hide();
  if(!sc.length){lastList=null;$('rh').hidden=true;$('grid').innerHTML='';$('note').textContent='Nothing matched. Try a genre, theme or actor name.';return}
  $('note').textContent='';show(sc.slice(0,40).map(x=>[x[0],0]),`Matches for “${q}”`);
}
